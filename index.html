<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Durán Carasso · Reseñas</title>
<link rel="icon" href="https://adriapintat-rgb.github.io/durancarasso-paneles/dc/favicon-icon.png">
<style>
  /* Propio de esta página; el look común (colores, tipografía, barra) viene del kit DC enlazado debajo. */
  body { margin: 0; }
  .wrap { max-width: 520px; margin: 40px auto; padding: 0 16px; }
  .card { background: var(--surface, #fff); border: 1px solid var(--line, #e2e2e2); border-radius: 14px; padding: 36px 20px; text-align: center; }
  .icono { width: 56px; height: 56px; line-height: 56px; border-radius: 50%; margin: 0 auto 18px;
           background: var(--brand, #003d4b); color: var(--brand-ink, #fff); font-size: 28px; font-weight: 600; }
  .ok { background: #1f7a4d; color: #fff; } .info { background: var(--brand, #003d4b); } .error { background: #b42318; color: #fff; }
  .girando { background: none; border: 5px solid var(--brand-tint, #dbe8eb); border-top-color: var(--brand, #003d4b); box-sizing: border-box;
             animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .girando { animation-duration: 2.4s; } }
  h1 { font-size: 24px; margin: 0 0 14px; }
  p { font-size: 16px; line-height: 1.6; color: var(--ink, #1a1a1a); margin: 0; }
  button { margin-top: 22px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--brand, #003d4b); color: var(--brand-ink, #fff);
           font: 600 15px/1 var(--sans, system-ui, sans-serif); cursor: pointer; }
  .pie { text-align: center; color: var(--muted, #666); font-size: 13px; margin-top: 18px; }
</style>
<link rel="stylesheet" href="https://adriapintat-rgb.github.io/durancarasso-paneles/dc/dc-ui.css">
</head>
<body>
<header class="dc-topbar">
  <a class="dc-brand" href="https://dc-hub-lilac.vercel.app" target="_top" aria-label="Durán Carasso"><img class="dc-logo-largo" src="https://adriapintat-rgb.github.io/durancarasso-paneles/dc/logo-largo.jpg" alt="Durán Carasso"><img class="dc-logo-corto" src="https://adriapintat-rgb.github.io/durancarasso-paneles/dc/logo-redondo.png" alt=""></a>
  <span class="dc-sep" aria-hidden="true"></span>
  <span class="dc-titulo">Reseñas</span>
  <span class="dc-hueco"></span>
</header>
<div class="wrap">
  <div class="card">
    <div id="icono" class="icono girando"></div>
    <h1 id="titulo">Publicando en Google…</h1>
    <p id="texto">Un momento, no cierres esta pestaña.</p>
    <button id="reintentar" hidden>Volver a intentarlo</button>
  </div>
  <p class="pie">Durán Carasso · Gestión de reseñas</p>
</div>
<script>
  // Esta página está fuera de Google a propósito: llama al robot (web app de Apps Script) sin las
  // cookies de Google del navegador, así que funciona aunque haya varias cuentas de Google abiertas.
  var ROBOT = 'https://script.google.com/macros/s/AKfycbzfTJuNfpVrpQUjnsOz25ARJ9v3uHBeEue0s-TC5PcAczetRc6-2MIjru26OxVi7gooXg/exec';
  var ICONOS = { ok: '✓', info: 'i', error: '!' };

  function mostrar(tipo, titulo, html) {
    var icono = document.getElementById('icono');
    icono.className = 'icono ' + tipo;
    icono.textContent = ICONOS[tipo] || '';
    document.getElementById('titulo').textContent = titulo;
    document.getElementById('texto').innerHTML = html; // el robot ya escapa el texto de la reseña
    document.title = titulo + ' · Durán Carasso';
  }

  function publicar() {
    var boton = document.getElementById('reintentar');
    boton.hidden = true;
    var p = new URLSearchParams(location.search);
    if (!p.get('id') || !p.get('t')) {
      mostrar('error', 'Enlace no válido', 'Abre el botón "Publicar" desde el correo del aviso.');
      return;
    }
    p.set('fmt', 'json');
    var control = new AbortController();
    var espera = setTimeout(function () { control.abort(); }, 60000);
    fetch(ROBOT + '?' + p.toString(), { credentials: 'omit', cache: 'no-store', signal: control.signal })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (r) {
        clearTimeout(espera);
        mostrar(ICONOS[r.tipo] ? r.tipo : 'error', r.titulo || 'Respuesta del robot', r.texto || '');
      })
      .catch(function () {
        clearTimeout(espera);
        mostrar('error', 'No se ha podido conectar con el robot',
          'Comprueba la conexión y vuelve a intentarlo. Si la respuesta ya se publicó, no se publicará dos veces.');
        boton.hidden = false;
      });
  }

  document.getElementById('reintentar').addEventListener('click', function () {
    mostrar('info', 'Publicando en Google…', 'Un momento, no cierres esta pestaña.');
    document.getElementById('icono').className = 'icono girando';
    document.getElementById('icono').textContent = '';
    publicar();
  });
  publicar();
</script>
</body>
</html>
